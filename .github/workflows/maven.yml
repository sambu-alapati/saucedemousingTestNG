name: Selenium TestNG CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
 # Allows manual trigger from the GitHub Actions tab

jobs:
  run-ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Selenium TestNG Suite (Headless)
        run: mvn clean test -Dheadless=true

      - name: Upload ExtentReports & Failure Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-execution-reports
          path: |
            reports/*.html
            screenshots/*.png
          if-no-files-found: ignore
